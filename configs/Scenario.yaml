# ============================================================
# ADM1 simulation scenarios
# ============================================================
# This file defines the simulation cases to run.
# Each scenario bundles the structural choices required:
# - initial states, influent mode, duration, parameter overrides
#   (for now, only scenarios with a temperature change).
# ============================================================

# ------ Active scenario ------
# active_scenario: BSM2_dynamic
# active_scenario: thermophilic
# active_scenario: hybrid_demo     # see docs/hybrid.md and examples/
# active_scenario: no_xc_demo             # BSM2 without X_c (use_xc = 0)
active_scenario: Tatiana_RM_lab_5L      # Tatiana's 5 L digester, cross-test with RM_without_Xc
# active_scenario : BSM2_steady_state

# ------ Scenario definitions ------
scenarios:

  # --- Reference BSM2 scenario with dynamic influent ---
  BSM2_dynamic:
    description: >
      Reference BSM2 simulation (Rosen et al., 2006).
      Mesophilic conditions (35 C), daily dynamic influent.
    initial_states: BSM2            # Key in configs/states/initial_states.yaml
    influent_mode: dynamic          # Key in configs/influent/influent.yaml
    T_op:
      value: 308.15
      units: "K"
      description: "Operating temperature (mesophilic, 35 C)"
    parameter_overrides: {}         # No override — uses adm1_parameters.yaml

  # --- BSM2 ring test, daily feed + dynamic Q (recommended validation run, ~3 min) ---
  BSM2_ringtest:
    description: >
      BSM2 validation run: daily-averaged influent driven with the dynamic flow Q(t).
      Compare results/dynamic_out.csv to tests/data/Matlabout_dyn.csv with
      tests/benchmark_bsm2.py --dynamic-q.
    initial_states: BSM2
    influent_mode: dynamic_Q
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides: {}

  # --- BSM2 ring test at full 15-min resolution (~1 h) ---
  BSM2_ringtest_15min:
    description: >
      Strictest BSM2 validation: 15-min influent, dynamic Q(t). With dt_out: null the
      output has one row per influent row (26 881), like PyADM1 and Matlabout_dyn.csv. ~50 min.
    initial_states: BSM2
    influent_mode: dynamic_15min_Q
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides: {}

  # --- BSM2 steady-state test (PyADM1 paper Tables 2-4; Rosen & Jeppsson 2006) ---
  BSM2_steady_state:
    description: >
      Second BSM2 benchmark (Rosen & Jeppsson 2006 steady state; PyADM1 paper Tables 2-4):
      constant BSM2 digester influent, q_ad = 170 m3/d, 200 d. The final state must equal
      the published BSM2 steady state (tests/data/bsm2_steady_state.csv) to ~1e-6;
      check with: python tests/benchmark_bsm2_steady.py --results results/dynamic_out.csv
    initial_states: BSM2_steady_init
    influent_mode: constant
    t_end: 200                        # scenario-level horizon [d] (overrides Simulation.yaml)
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides:
      q_ad:
        value: 170.0
        units: "m^3.d^-1"
        description: "BSM2 steady-state digester feed flow (the dynamic file starts at 178.47)"

  # --- BSM2 scenario with constant influent ---
  BSM2_constant:
    description: >
      BSM2 simulation with a constant influent (mean values).
      Useful to reach a reference steady state.
    initial_states: BSM2
    influent_mode: constant
    T_op:
      value: 308.15
      units: "K"
      description: "Operating temperature (mesophilic, 35 C)"
    parameter_overrides: {}

  # --- Thermophilic scenario (example) ---
  thermophilic:
    description: >
      Thermophilic conditions (55 C) with the BSM2 dynamic influent.
      Higher ammonia concentration.
    initial_states: BSM2
    influent_mode: dynamic
    T_op:
      value: 328.15
      units: "K"
      description: "Operating temperature (thermophilic, 55 C)"
    parameter_overrides:
      K_I_nh3:
        value: 0.003
        units: "M"
        description: "Increased NH3 inhibition constant in thermophilic regime"

  # --- Batch-validation scenario (example) ---
  batch_validation:
    description: >
      Batch-mode simulation (no feed).
      Useful to validate the biochemical kinetics.
    initial_states: BSM2
    influent_mode: constant
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides:
      q_ad:
        value: 0.0
        units: "m^3.d^-1"
        description: "Zero flow — batch mode"

  # --- Hybrid-mode demo (Tiers 1 + 2) ---
  # Plugs three registered models from models/*.yaml into a BSM2 dynamic run.
  # See `python main.py --list-models` for what is registered and
  # `python main.py --list-hooks` for what can be plugged into.
  hybrid_demo:
    description: >
      BSM2 dynamic with all three hybrid plug-points enabled (Tiers 1 + 2):
      a temperature-aware Rho_11, a Hill-style I_nh3, and a small residual
      correction on dissolved methane.
    initial_states: BSM2
    influent_mode: dynamic
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides: {}
    hybrid:
      enabled: true
      use: [rho11_T_aware, nh3_hill, methane_bias]

  # --- Hybrid LR demo: Rho_2 replaced by a Python-callable LR ---
  # The regression is fitted at module import time on synthetic data and
  # used in place of the classical first-order carbohydrate hydrolysis.
  hybrid_lr_demo:
    description: >
      BSM2 dynamic with Rho_2 replaced by a linear-regression model loaded
      as a Python callable (fitted at module import via np.linalg.lstsq).
    initial_states: BSM2
    influent_mode: dynamic
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides: {}
    hybrid:
      enabled: true
      use: [rho2_lr_module]

  # --- Hybrid LR demo: Rho_2 replaced by a saved artefact ---
  # Same prediction as hybrid_lr_demo, but the LR weights are loaded from a
  # committed .npz under models/ (no fit at startup). Useful to A/B the two
  # load paths.
  hybrid_lr_spec_demo:
    description: >
      BSM2 dynamic with Rho_2 replaced by a saved linear-regression model
      (models/rho2_lr_synthetic.{yaml,npz}).
    initial_states: BSM2
    influent_mode: dynamic
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides: {}
    hybrid:
      enabled: true
      use: [rho2_lr_synthetic]

  # --- New scenario: pig-slurry test ---
  pig_slurry_test:
    description: >
      Pig-slurry simulation under mesophilic conditions.
      Starts from the BSM2 initial state to ensure numerical stability.
    initial_states: BSM2
    influent_mode: pig_slurry
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides:
      q_ad:
        value: 35.0
        units: "m^3.d^-1"
        description: "Reduced flow for a stable start-up on pig slurry"

  # ============================================================
  # Scenarios without composite X_c (use_xc = 0, Batstone et al. 2015)
  # ============================================================

  # --- BSM2 without X_c: same digester, influent re-characterised in X_ch/X_pr/X_li/X_I ---
  no_xc_demo:
    description: >
      BSM2 constant feed with the disintegration step switched off (use_xc = 0). The composite
      X_xc of the feed is redistributed with f_*_xc into X_ch/X_pr/X_li/X_I/S_I (influent
      'constant_no_xc'). Compare with BSM2_constant to see the effect of removing X_c.
    initial_states: BSM2
    influent_mode: constant_no_xc
    T_op:
      value: 308.15
      units: "K"
    parameter_overrides:
      use_xc:
        value: 0
        units: "-"
        description: "Disintegration off; decay split with f_*_xb"

  # --- Tatiana's lab digester (5 L) as in the RM_without_Xc code: cross-test of use_xc = 0 ---
  Tatiana_RM_lab_5L:
    description: >
      Tatiana's 5 L lab digester, 193 d (from 2023-03-15), daily feed with dynamic flow, feed
      characterised in X_ch/X_pr/X_li/X_I, calibrated kinetics of RM_without_Xc/parameters_dyn.txt.
      Reproduces the RM_without_Xc notebook run AS IS (T_op fixed at 35 C although the data are
      at 39 C - that is what the original code does). Cross-test:
      python tests/compare_tatiana_rm.py --results results/dynamic_out.csv
    initial_states: Tatiana_lab_5L
    influent_mode: tatiana_lab_5L
    t_end: 193
    T_op:
      value: 308.15
      units: "K"
      description: "35 C as hard-coded in the original code (data are at 39 C)"
    parameter_overrides:
      use_xc:    {value: 0,        units: "-",          description: "No disintegration (RM_without_Xc)"}
      V_liq:     {value: 0.005,    units: "m^3",        description: "5 L liquid volume"}
      V_gas:     {value: 0.002,    units: "m^3",        description: "2 L headspace"}
      gas_law_patm: {value: 1,     units: "-",          description: "Headspace at P_atm: same q_gas law as RM_without_Xc (k_p not used)"}
      k_hyd_ch:  {value: 0.2350,   units: "d^-1",       description: "Calibrated (RM parameters_dyn.txt)"}
      k_hyd_pr:  {value: 0.4006,   units: "d^-1",       description: "Calibrated"}
      k_hyd_li:  {value: 0.31,     units: "d^-1",       description: "Calibrated"}
      k_m_c4:    {value: 13.7,     units: "d^-1",       description: "Calibrated"}
      k_m_pro:   {value: 5.5,      units: "d^-1",       description: "Calibrated"}
      K_I_h2_pro: {value: 2.4864e-7, units: "kgCOD.m^-3", description: "Calibrated"}
      k_m_ac:    {value: 5.0,      units: "d^-1",       description: "Calibrated"}
      K_I_nh3:   {value: 4.7068e-4, units: "M",         description: "Calibrated"}
      K_S_h2:    {value: 3.0e-5,   units: "kgCOD.m^-3", description: "Calibrated"}

  # --- Same digester at its real temperature (39 C) ---
  Tatiana_RM_lab_5L_39C:
    description: >
      Tatiana's 5 L lab digester at its measured operating temperature (39 C): Henry, K_a and
      K_w constants follow T_op. Physically consistent version of Tatiana_RM_lab_5L.
    initial_states: Tatiana_lab_5L
    influent_mode: tatiana_lab_5L
    t_end: 193
    T_op:
      value: 312.15
      units: "K"
      description: "39 C (measured)"
    parameter_overrides:
      use_xc:    {value: 0,        units: "-"}
      V_liq:     {value: 0.005,    units: "m^3"}
      V_gas:     {value: 0.002,    units: "m^3"}
      gas_law_patm: {value: 1,     units: "-"}
      k_hyd_ch:  {value: 0.2350,   units: "d^-1"}
      k_hyd_pr:  {value: 0.4006,   units: "d^-1"}
      k_hyd_li:  {value: 0.31,     units: "d^-1"}
      k_m_c4:    {value: 13.7,     units: "d^-1"}
      k_m_pro:   {value: 5.5,      units: "d^-1"}
      K_I_h2_pro: {value: 2.4864e-7, units: "kgCOD.m^-3"}
      k_m_ac:    {value: 5.0,      units: "d^-1"}
      K_I_nh3:   {value: 4.7068e-4, units: "M"}
      K_S_h2:    {value: 3.0e-5,   units: "kgCOD.m^-3"}
