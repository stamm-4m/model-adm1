  S_bu:     {value: 0.001, units: "kgCOD.m^-3"}
  S_pro:    {value: 0.001, units: "kgCOD.m^-3"}
  S_ac:     {value: 0.001, units: "kgCOD.m^-3"}
  S_h2:     {value: 1e-08, units: "kgCOD.m^-3"}
  S_ch4:    {value: 1e-05, units: "kgCOD.m^-3"}
  S_IC:     {value: 0.04, units: "kmol C.m^-3"}
  S_IN:     {value: 0.01, units: "kmol N.m^-3"}
  S_I:      {value: 0.22, units: "kgCOD.m^-3"}
  X_xc:     {value: 0.0, units: "kgCOD.m^-3"}
  X_ch:     {value: 5.4, units: "kgCOD.m^-3"}
  X_pr:     {value: 20.4, units: "kgCOD.m^-3"}
  X_li:     {value: 5.6, units: "kgCOD.m^-3"}
  X_su:     {value: 0.0, units: "kgCOD.m^-3"}
