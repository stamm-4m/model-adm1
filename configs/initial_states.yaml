  # algebraic states (recomputed from the charge balance at start-up)
  S_H_ion:    {value: 3.423e-8, units: "kmol.m^-3"}
  S_va_ion:   {value: 0.011,  units: "kgCOD.m^-3"}
  S_bu_ion:   {value: 0.013,  units: "kgCOD.m^-3"}
  S_pro_ion:  {value: 0.016,  units: "kgCOD.m^-3"}
  S_ac_ion:   {value: 0.2,    units: "kgCOD.m^-3"}
  S_hco3_ion: {value: 0.14,   units: "kmol.m^-3"}
  S_co2:      {value: 0.01,   units: "kmol.m^-3"}
  S_nh3:      {value: 0.0041, units: "kmol.m^-3"}
  S_nh4_ion:  {value: 0.126,  units: "kmol.m^-3"}
  S_gas_h2:   {value: 1.02e-5, units: "kgCOD.m^-3"}
  S_gas_ch4:  {value: 1.63,   units: "kgCOD.m^-3"}
  S_gas_co2:  {value: 0.014,  units: "kmol.m^-3"}

