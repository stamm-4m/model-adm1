# ============================================================
# Numerical settings for the ADM1 simulation
# ============================================================
# This file is dedicated to numerical resolution of the equations.
# It is independent from the physical content of the model.
# ============================================================

# stamm-model-core (2026-11-06): mode, dt_out, t_start, include_initial and output.results_dir /
# runs_dir / zip / code_files. The output times come from time.dt_out below (null = one row per
# influent row), computed by main.py; the top-level dt_out is only the core's fallback.
mode: continuous
dt_out: 1.0
t_start: 0.0
include_initial: true
# Which influent row is held over each interval [t_(i-1), t_i] of a dynamic influent (backlog 63):
#   start  row i-1: the value of a row holds until the next row (default: it reproduces the MATLAB
#          BSM2 reference best, tools/influent_hold_report.md and docs/validation.md section E)
#   end    row i: the value at the end of the interval, as the PyADM1 loop (Sadrimajd et al. 2021);
#          with the daily influent it shifts the feed by one day (9 states out of tolerance)
#   legacy model-adm1 before 2026-11-06 (row i-1, but row i at t_i exactly): reproduces earlier runs
influent_hold: start

# ------ ODE solver ------
solver:
  method: "BDF"          # Use an IMPLICIT solver: "BDF" (default), "Radau" or "LSODA". The system is stiff
                         # (S_h2 is integrated); explicit RK45/DOP853 are >30x slower and may not finish.
  allow_explicit: false   # explicit solvers are refused unless true (they give wrong results here)
  rtol: 1.0e-6            # Relative tolerance
  atol: 1.0e-8            # Absolute tolerance
  max_step: 1.0           # Maximum time step [d] (inf = unconstrained)
  piecewise: true         # restart the integrator at every influent step (recommended, PyADM1-like)

# ------ Duration and output time step ------
time:
  t_start: 0             # Start time [d]
  t_end: null            # null = end of the influent data (dynamic) or t_end_default_constant (constant)
  t_end_default_constant : 30 # Default duration when the influent is constant
  dt_out: null           # Output time step [d]. null = one row per influent row (daily CSV -> daily,
                         # 15-min CSV -> 15-min, like PyADM1). Set e.g. 1.0 to force daily output.
  units: "d"

# ------ Result-saving options ------
output:
  save_results: true
  save_figures: true
  show_figures: false    # set true to open the matplotlib windows
  output_dir: "results/"
  results_dir: "results/"   # stamm-model-core: results/dynamic_out.csv
  runs_dir: "runs/"         # stamm-model-core: runs/<run_id>/ + runs/<run_id>.zip
  zip: true
  code_files: ["main.py", "model.py", "initial_states.py", "src/*.py"]
  run_package:            # standard package for the STAMM registry (docs/run_package.md)
    enabled: true         # runs/<run_id>/ = dynamic_out.csv (unchanged) + run.json (+ influent.csv);
                          # folder and zip: output.runs_dir / output.zip above
